# values.yaml

# Bundled Keycloak (Bitnami subchart) — same namespace as RaSCaaS; wires oauth2-proxy OIDC automatically.
keycloak:
  enabled: true
  realm: rascaas
  clientId: platform-ui
  clientSecret: rascaas-local-client-secret
  # Browser-facing OIDC issuer base (no trailing slash). Empty = in-cluster http://<release>-keycloak
  publicBaseUrl: ""
  httpRelativePath: /
  exposeRoute:
    enabled: false
    hostname: auth.example.com
    servicePort: 80
  # --- Bitnami keycloak subchart (https://github.com/bitnami/charts/tree/main/bitnami/keycloak) ---
  auth:
    adminUser: admin
    adminPassword: admin
  production: false
  proxyHeaders: xforwarded
  hostnameStrict: false
  extraEnvVars:
    - name: KC_HOSTNAME_STRICT
      value: "false"
  resources:
    requests:
      memory: 768Mi
      cpu: 500m
    limits:
      memory: 1536Mi
      cpu: 1000m
  keycloakConfigCli:
    enabled: true
    # ConfigMap from templates/keycloak-realm-configmap.yaml — name must match release (default: rascaas-keycloak-realm)
    existingConfigmap: rascaas-keycloak-realm
  postgresql:
    enabled: true
    auth:
      postgresPassword: rascaas-keycloak-db
      password: rascaas-keycloak-db

secrets:
  # csi-driver — AWS Secrets Manager via SecretProviderClass + secrets-store CSI driver.
  #              Per-app SPCs under helm/_crds/csi-driver/ sync fastapi-secrets / oauth2proxy-secret.
  # plain       — pre-created Secrets: copy plain-secrets.example.yaml → plain-secrets.yaml, kubectl apply.
  mode: plain
  # Shared fallback (optional). Prefer per-app names below.
  secretProviderClass: ""
  fastapiSecretProviderClass: rascaas-fastapi-secrets-provider
  oauth2proxySecretProviderClass: oauth2proxy-secrets-provider
  # Annotate SAs with the same ARN (_crds/service-accounts/).
  irsaRoleArn: "arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/platform-rascaas"
  mountPath: /mnt/secrets-store

gateway:
  enabled: true
  name: rascaas-gateway
  namespace: ""  # defaults to Helm release namespace
  # Public hostname (HTTPRoute hostnames). Gateway HTTPS listener: helm/_crds/gateway/rascaas-gateway-https.template.yaml
  hostname: ""

# SQLite on PVC — keep replicas=1 (EBS gp3 is RWO; not a shared/RWX volume).
# With persistence.enabled FastAPI uses strategy.type=Recreate (not RollingUpdate maxSurge:0):
# Recreate waits for full pod delete + volume detach before the next pod starts.
# Disable HPA when enabled. Default: dynamic PVC (EBS CSI via storageClassName).
# Optional static PV: set pv.create=true and pv.volumeHandle=vol-xxxxxxxx.
persistence:
  enabled: true
  # claimName: ""   # default: <fastapi.name>-data
  size: 1Gi
  accessMode: ReadWriteOnce
  storageClassName: gp3
  mountPath: /data
  sqlitePath: /data/rascaas.db
  annotations: {}
  pv:
    create: false
    # name: ""      # default: <release>-data-pv
    volumeHandle: ""
    csiDriver: ebs.csi.aws.com
    fsType: ext4
    reclaimPolicy: Retain
    annotations: {}

# Live listing of UAT vClusters on the host.
# Each env: namespace + release = tmp-<repo>-<branch> (one vCluster per ns).
# vclusterNamespace is the legacy shared pool still scanned by RaSCaaS.
hostCluster:
  vclusterNamespace: vcluster
  rbac:
    create: true

fastapi:
  name: rascaas
  image: awsamazon.com/us:latest/rascaas-ui
  replicas: 1
  imagePullPolicy: IfNotPresent
  env:
    GITHUB_APP_ID: "12345"
    GITHUB_INSTALLATION_ID: "67890"
    OIDC_ISSUER_URL: "https://idp.sub.host.co"
    OIDC_CLIENT_ID: "platform-ui"
    ENVIRONMENT: "production"
    LOG_LEVEL: "INFO"
    APP_BASE_URL: "https://rascaas.example.com"
  secretName: fastapi-secrets
  secretEnv:
    GITHUB_PRIVATE_KEY: github-private-key
    RUNNER_CALLBACK_TOKEN: runner-callback-token
  # Pod may start before CSI/SM has these keys (optional secretKeyRef).
  secretEnvOptional:
    - RUNNER_CALLBACK_TOKEN
  minReplicas: 1
  maxReplicas: 3
  resources:
    requests:
      memory: 256Mi
      cpu: 500m
    limits:
      memory: 512Mi
      cpu: 1000m
  port: 8000
  labels: {}
  livenessProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10

oauth2proxy:
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
  name: oauth2proxy
  replicas: 1
  upstreamUrl: ""
  oidcIssuerUrl: "https://idp.sub.host.co"
  clientId: "platform-ui"
  redirectUrl: "https://rascaas.example.com/oauth2/callback"
  secretName: oauth2proxy-secret
  clientSecretKey: client-secret
  cookieSecretKey: cookie-secret
  port: 4180
  imagePullPolicy: IfNotPresent
  passAccessToken: true
  setXAuthRequest: true
  cookieSecure: false
  skipProviderButton: true
  emailDomains: "*"
  # Optional env overrides (e.g. OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL for Cognito SAML)
  extraEnv: {}
  labels: {}
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  livenessProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 10

# Dedicated CronJob workload (separate image from the RaSCaaS IDP).
# Build: RasCaaS/ecr-cleanup/ → ECR repo rascaas-uat-ecr-cleanup
# IRSA on the cleanup SA — do not grant ECR delete to the FastAPI secrets-reader role.
uatTempEcrCleanup:
  enabled: false
  repository: uat-temp
  retentionDays: 14
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  dryRun: false
  awsRegion: us-west-2
  # Empty = create SA named <release>-uat-temp-ecr-cleanup
  serviceAccountName: ""
  # IRSA role ARN for ECR delete on uat-temp only
  roleArn: ""
  # Required when enabled — rascaas-uat-ecr-cleanup image (not fastapi.image)
  image: ""
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m
