{{- if .Values.gateway.enabled }}
# Probes + runner callback — routed directly to FastAPI (bypass oauth2-proxy).
# Authenticated browser /api/* must go through oauth2-proxy (catch-all / on
# oauth2proxy-frontend-route) so X-Auth-Request-* headers are set.
# Do NOT PathPrefix /api/repos|/api/branches|/api/trigger here — that
# skips the proxy and FastAPI returns 401 for browser cookie sessions.
# Keep /api/runner here (GHA runners POST with RUNNER_CALLBACK_TOKEN).
#
# After changing these matches, confirm the ALB listener has /api/runner*
# → FastAPI with priority BEFORE catch-all /* → oauth2 (see
# helm/_crds/gateway/README.md § Required ALB listener rules). Also confirm
# no stale /api/repos|/api/branches|/api/trigger rules (LBC needs
# SetRulePriorities — see iam/policy-qa-kovr-lbc-set-rule-priorities.json).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.fastapi.name }}-api-route
  namespace: {{ include "rascaas.namespace" . }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "rascaas.gateway.name" . }}
      namespace: {{ include "rascaas.gateway.namespace" . }}
      sectionName: https
{{- if .Values.gateway.hostname }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /health
        - path:
            type: PathPrefix
            value: /ready
        # GitHub Actions runner progress (shared-secret auth on FastAPI — not oauth2)
        - path:
            type: PathPrefix
            value: /api/runner
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.fastapi.name }}
          port: {{ .Values.fastapi.port }}
{{- end }}
