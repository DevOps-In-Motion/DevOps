# QA — HTTPS listener for rascaas-gateway (rascaas.qa.kovrai.com)
# Account 650251729525, us-west-2.
#
# Prerequisite: kubectl apply -f rascaas-gateway-base.yaml
#
# Cert: ACM *.qa.kovrai.com
#   arn:aws:acm:us-west-2:650251729525:certificate/435ee5c0-a0e5-4edc-87b7-6f9248f22e45
#
# Attach LBC via Gateway.spec.infrastructure.parametersRef (not annotation).
# See AWS LBC docs: https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/gateway/customization/
#
# DNS: rascaas.qa.kovrai.com → ALB hostname from:
#   kubectl get gateway rascaas-gateway -n rascaas -o jsonpath='{.status.addresses[0].value}'
---
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: rascaas-lbc-config
  namespace: rascaas
spec:
  loadBalancerAttributes: []
  scheme: internet-facing
  defaultTargetGroupConfiguration:
    name: rascaas-default-tgc
  listenerConfigurations:
    - protocolPort: HTTPS:443
      defaultCertificate: arn:aws:acm:us-west-2:650251729525:certificate/435ee5c0-a0e5-4edc-87b7-6f9248f22e45
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rascaas-gateway
  namespace: rascaas
spec:
  gatewayClassName: alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: rascaas-lbc-config
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: rascaas.qa.kovrai.com
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
