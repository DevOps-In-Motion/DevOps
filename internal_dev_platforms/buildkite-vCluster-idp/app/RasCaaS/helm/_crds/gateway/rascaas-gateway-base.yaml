# RaSCaaS Gateway — phase 1: ALB with HTTP listener (:80).
# PREREQUISITE: Gateway API + AWS LBC gateway CRDs (see helm/_crds/README.md §1).
# Apply before the Helm chart HTTPRoutes:
#   kubectl apply -f helm/_crds/gateway/rascaas-gateway-base.yaml
#
# After status.addresses is set, apply HTTPS:
#   QA:  helm/_crds/gateway/rascaas-gateway-https.qa.yaml
#
# LBC v3.4+ (QA):
#   - Attach LoadBalancerConfiguration via Gateway.spec.infrastructure.parametersRef
#     (same as drawhaus/excalidraw). Annotation alone does NOT apply scheme —
#     LBC infers internal → internal-* ALB your Mac cannot reach.
#   - ClusterIP backends need Service-level TargetGroupConfiguration
#     (targetReference + targetType: ip).
---
# Gateway default (no targetReference) — referenced by LoadBalancerConfiguration
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: rascaas-default-tgc
  namespace: rascaas
spec:
  defaultConfiguration:
    targetType: ip
---
# oauth2-proxy Service (ClusterIP :80 → pod :4180)
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: oauth2proxy-tgc
  namespace: rascaas
spec:
  targetReference:
    kind: Service
    name: oauth2proxy
  defaultConfiguration:
    targetType: ip
  routeConfigurations:
    - routeIdentifier:
        kind: HTTPRoute
        namespace: rascaas
        name: oauth2proxy-frontend-route
      targetGroupProps:
        targetType: ip
        healthCheckConfig:
          healthCheckProtocol: HTTP
          healthCheckPath: /ping
---
# FastAPI Service (ClusterIP :8000)
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: rascaas-fastapi-tgc
  namespace: rascaas
spec:
  targetReference:
    kind: Service
    name: rascaas
  defaultConfiguration:
    targetType: ip
  routeConfigurations:
    - routeIdentifier:
        kind: HTTPRoute
        namespace: rascaas
        name: rascaas-api-route
      targetGroupProps:
        targetType: ip
        healthCheckConfig:
          healthCheckProtocol: HTTP
          healthCheckPath: /health
---
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: rascaas-lbc-config
  namespace: rascaas
spec:
  loadBalancerAttributes: []
  scheme: internet-facing
  defaultTargetGroupConfiguration:
    name: rascaas-default-tgc
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rascaas-gateway
  namespace: rascaas
spec:
  gatewayClassName: alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: rascaas-lbc-config
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
