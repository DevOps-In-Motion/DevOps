---
# RaSCaaS FastAPI — GitHub App private key (QA)
# Pattern: C2S platform/docs/c2s/deliverables/k8s/helm/_secrets/secretproviderclass-*.yaml
#
# Cluster: YOUR_EKS_CLUSTER | Account: YOUR_AWS_ACCOUNT_ID | Region: us-west-2
# AWS Secrets Manager: rascaas-secrets (keys GITHUB_PRIVATE_KEY, RUNNER_CALLBACK_TOKEN)
# IRSA: rascaas-sa → platform-rascaas
#
# Helm: secrets.fastapiSecretProviderClass=rascaas-fastapi-secrets-provider
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rascaas-fastapi-secrets-provider
  namespace: rascaas
  labels:
    app.kubernetes.io/part-of: rascaas
    app.kubernetes.io/component: fastapi
    app.kubernetes.io/name: rascaas
spec:
  provider: aws
  parameters:
    region: us-west-2
    objects: |
      - objectName: "rascaas-secrets"
        objectType: "secretsmanager"
        jmesPath:
          - path: "GITHUB_PRIVATE_KEY"
            objectAlias: "GITHUB_PRIVATE_KEY"
          - path: "RUNNER_CALLBACK_TOKEN"
            objectAlias: "RUNNER_CALLBACK_TOKEN"
  secretObjects:
    - secretName: fastapi-secrets
      type: Opaque
      data:
        - objectName: GITHUB_PRIVATE_KEY
          key: github-private-key
        - objectName: RUNNER_CALLBACK_TOKEN
          key: runner-callback-token
