---
# oauth2-proxy — Cognito client secret + cookie secret (QA)
# Third-party auth proxy in the RaSCaaS stack (not Kovr BFF/DS/etc.).
# Pattern: C2S platform/docs/c2s/deliverables/k8s/helm/_secrets/secretproviderclass-*.yaml
#
# Cluster: YOUR_EKS_CLUSTER | Account: YOUR_AWS_ACCOUNT_ID | Region: us-west-2
# AWS Secrets Manager: rascaas-secrets (keys OIDC_CLIENT_SECRET, OAUTH2_COOKIE_SECRET)
# IRSA: oauth2proxy-sa → platform-rascaas
#
# Helm: secrets.oauth2proxySecretProviderClass=oauth2proxy-secrets-provider
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: oauth2proxy-secrets-provider
  namespace: rascaas
  labels:
    app.kubernetes.io/part-of: rascaas
    app.kubernetes.io/component: oauth2-proxy
    app.kubernetes.io/name: oauth2proxy
spec:
  provider: aws
  parameters:
    region: us-west-2
    objects: |
      - objectName: "rascaas-secrets"
        objectType: "secretsmanager"
        jmesPath:
          - path: "OIDC_CLIENT_SECRET"
            objectAlias: "OIDC_CLIENT_SECRET"
          - path: "OAUTH2_COOKIE_SECRET"
            objectAlias: "OAUTH2_COOKIE_SECRET"
  secretObjects:
    - secretName: oauth2proxy-secret
      type: Opaque
      data:
        - objectName: OIDC_CLIENT_SECRET
          key: client-secret
        - objectName: OAUTH2_COOKIE_SECRET
          key: cookie-secret
