# QA — RaSCaaS Helm overlay
# Account: YOUR_AWS_ACCOUNT_ID | Region: us-west-2
# Public URL: https://rascaas.qa.example.com
#
# ── Cognito (YOUR_COGNITO_USER_POOL) ─────────────────────────────────────────────
#   Issuer:  https://cognito-idp.us-west-2.amazonaws.com/us-west-2_YOUR_USER_POOL_ID
#   Pool:    YOUR_COGNITO_USER_POOL (us-west-2_YOUR_USER_POOL_ID)
#   ARN:     arn:aws:cognito-idp:us-west-2:YOUR_AWS_ACCOUNT_ID:userpool/us-west-2_YOUR_USER_POOL_ID
#
# ── Endpoint (all four must match) ─────────────────────────────────────
#   1. Gateway HTTPS  → helm/_crds/gateway/rascaas-gateway-https.qa.yaml
#   2. HTTPRoutes     → gateway.hostname below
#   3. App / OIDC     → APP_BASE_URL, redirectUrl below
#   4. Cognito client → callback https://rascaas.qa.example.com/oauth2/callback
#
# ── Before helm upgrade ──────────────────────────────────────────────────
#   kubectl apply -f _crds/gateway/rascaas-gateway-base.yaml
#   # Edit IAM cert ARN in rascaas-gateway-https.qa.yaml, then:
#   kubectl apply -f _crds/gateway/rascaas-gateway-https.qa.yaml
#   # CSI SPCs (FastAPI + oauth2-proxy):
#   kubectl apply -f _crds/service-accounts/
#   kubectl apply -f _crds/csi-driver/
#   # SM secret rascaas-secrets + IRSA role platform-rascaas must exist first
#   # (see _crds/csi-driver/README.md). Do not apply plain-secrets.yaml with CSI.
#   DNS: rascaas.qa.example.com → kubectl get gateway rascaas-gateway -n rascaas
#
#   helm dependency update ./rascaas
#   helm upgrade --install rascaas ./rascaas -n rascaas -f _values/qa-install-values.yaml

keycloak:
  enabled: false

secrets:
  mode: csi-driver
  fastapiSecretProviderClass: rascaas-fastapi-secrets-provider
  oauth2proxySecretProviderClass: oauth2proxy-secrets-provider
  mountPath: /mnt/secrets-store

# SQLite PVC for FastAPI only (not oauth2-proxy).
# gp3 = RWO (not shared). Chart uses strategy.type=Recreate when enabled so
# helm upgrades wait for detach before the next pod. Dynamic provision; leave pv.create=false.
persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  storageClassName: gp3
  pv:
    create: false

gateway:
  enabled: true
  name: rascaas-gateway
  hostname: rascaas.qa.example.com

fastapi:
  name: rascaas
  serviceAccountName: rascaas-sa
  image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/rascaas:0.3.1
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 8000
  secretName: fastapi-secrets
  secretEnv:
    GITHUB_PRIVATE_KEY: github-private-key
    RUNNER_CALLBACK_TOKEN: runner-callback-token
  secretEnvOptional:
    - RUNNER_CALLBACK_TOKEN
  # Redis auth secret created with rascaas-redis install (not CSI / SM).
  extraSecretEnv:
    REDIS_PASSWORD:
      name: rascaas-redis-auth
      key: redis-password
  minReplicas: 1
  maxReplicas: 3
  resources:
    requests:
      memory: 256Mi
      cpu: 500m
    limits:
      memory: 512Mi
      cpu: 1000m
  livenessProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
  env:
    GITHUB_APP_ID: "YOUR_GITHUB_APP_ID"
    GITHUB_INSTALLATION_ID: "YOUR_GITHUB_INSTALLATION_ID"
    GITHUB_DISPATCH_REPO: "YOUR_ORG/platform"
    GITHUB_DISPATCH_REF: "main"
    DEFAULT_WORKFLOW: "uat-deploy.yml"
    ENVIRONMENT: "production"
    LOG_LEVEL: "INFO"
    # LOG_FORMAT: "json"   # default when ENVIRONMENT=production
    APP_BASE_URL: "https://rascaas.qa.example.com"
    OIDC_ISSUER_URL: "https://cognito-idp.us-west-2.amazonaws.com/us-west-2_YOUR_USER_POOL_ID"
    OIDC_CLIENT_ID: "YOUR_COGNITO_CLIENT_ID"
    TRUST_OAUTH2_PROXY_IDENTITY: "true"
    # Cognito Hosted UI logout so Sign out does not silently SSO back in
    OIDC_LOGOUT_URL: "https://YOUR_COGNITO_DOMAIN.auth.us-west-2.amazoncognito.com/logout?client_id=YOUR_COGNITO_CLIENT_ID&logout_uri=https://rascaas.qa.example.com/"
    # Redis deployment locks (SET NX EX 8d). Chart: helm-charts/external/test/redis/
    REDIS_HOST: "rascaas-redis-master.rascaas.svc.cluster.local"
    DEPLOY_LOCK_TTL_S: "691200"
    DEPLOY_INFLIGHT_LOCK_TTL_S: "7200"

oauth2proxy:
  name: oauth2proxy
  serviceAccountName: oauth2proxy-sa
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 4180
  secretName: oauth2proxy-secret
  clientSecretKey: client-secret
  cookieSecretKey: cookie-secret
  oidcIssuerUrl: "https://cognito-idp.us-west-2.amazonaws.com/us-west-2_YOUR_USER_POOL_ID"
  clientId: "YOUR_COGNITO_CLIENT_ID"
  redirectUrl: "https://rascaas.qa.example.com/oauth2/callback"
  cookieSecure: true
  passAccessToken: true
  setXAuthRequest: true
  skipProviderButton: true
  emailDomains: "*"
  # Cognito SAML (Identity Center) tokens omit email_verified=true → oauth2-proxy 500 without this
  # Whitelist Cognito Hosted UI so /oauth2/sign_out?rd=…/logout is allowed
  extraEnv:
    OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
    OAUTH2_PROXY_WHITELIST_DOMAINS: "YOUR_COGNITO_DOMAIN.auth.us-west-2.amazoncognito.com"
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  livenessProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 10

# UAT variance images → ECR uat-temp; CronJob uses dedicated rascaas-uat-ecr-cleanup image.
# Create IAM role with iam/policy-rascaas-uat-temp-ecr-cleanup.json + iam/trust-rascaas-uat-temp-ecr-cleanup.json and set roleArn.
uatTempEcrCleanup:
  enabled: true
  repository: uat-temp
  retentionDays: 14
  schedule: "0 3 * * *"
  awsRegion: us-west-2
  dryRun: false
  roleArn: "arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/rascaas-uat-temp-ecr-cleanup"
  image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/rascaas-uat-ecr-cleanup:latest
  imagePullPolicy: IfNotPresent
