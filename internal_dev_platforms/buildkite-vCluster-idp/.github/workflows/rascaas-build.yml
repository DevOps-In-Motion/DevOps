# Build & push RaSCaaS host images:
#   - rascaas              — IDP UI
#   - rascaas-uat-ecr-cleanup — CronJob that GC's uat-temp (separate image)
# GitHub repo: YOUR_ORG/platform (local: platform-testing/).
# Trigger: workflow_dispatch only (RaSCaaS / Actions UI webhook) — never on push.
# Deploy to the host with Helm separately (see RasCaaS/README.md).

name: RaSCaaS — build & push image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default sha-<short> of this commit)"
        required: false
        type: string
        default: ""

env:
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

jobs:
  build:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rascaas
            context: RasCaaS
            ecr_repo: rascaas
          - name: rascaas-uat-ecr-cleanup
            context: RasCaaS/ecr-cleanup
            ecr_repo: rascaas-uat-ecr-cleanup
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-$(git rev-parse --short=12 HEAD)"
          fi
          IMAGE="${ECR_REGISTRY}/${{ matrix.ecr_repo }}:${TAG}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository
        run: |
          set -euo pipefail
          REPO="${{ matrix.ecr_repo }}"
          if ! aws ecr describe-repositories --repository-names "$REPO" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "$REPO" --region "$AWS_REGION"
          fi

      - name: Build & push
        working-directory: ${{ matrix.context }}
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          ECR_REPO: ${{ matrix.ecr_repo }}
        run: |
          set -euo pipefail
          if command -v podman >/dev/null 2>&1; then
            BUILDER=podman
          else
            BUILDER=docker
          fi
          $BUILDER build --platform linux/amd64 \
            -t "$IMAGE" -t "${ECR_REGISTRY}/${ECR_REPO}:latest" .
          $BUILDER push "$IMAGE"
          $BUILDER push "${ECR_REGISTRY}/${ECR_REPO}:latest"

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo "- \`${{ steps.meta.outputs.image }}\`"
            echo "- Also tagged \`${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
